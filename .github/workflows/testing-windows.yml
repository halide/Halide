name: Windows

on:
  # Pull requests can restore caches saved on main but not each other's, so
  # caches are only saved by these runs, which stop once the caches are
  # filled. See the "Save vcpkg binary cache" step.
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/testing-windows.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/vcpkg-ports/**"
      - "cmake/vcpkg-triplets/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "doc/**"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".lldbinit"
      - ".github/**"
      - "!.github/workflows/testing-windows.yml"
      - "packaging/**"
      - "Makefile"
      - "Makefile.inc"
      - 'run-clang-tidy.sh'
      - '**.clang-tidy'
      - "**.md"
      - ".claude/**"
      - ".devcontainer/**"
      - ".pre-commit-config.yaml"
      - ".clang-format"
      - ".clang-format-ignore"
      - "run-clang-format.sh"
      - ".git-blame-ignore-revs"
      - ".gdbinit"
      - "tools/audit_test_labels.py"
      - "tools/check_cmake_*.py"
      # Apps are tested by testing-apps.yml; test/integration by testing-ecosystem.yml.
      - "apps/**"
      - "test/integration/**"
      - "codecov.yml"
      - "tools/run-coverage.sh"
      # Python bindings are disabled in this workflow's CI presets.
      - "python_bindings/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: windows-${{ matrix.bits }} / ${{ matrix.uv_group }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        bits: [ "32" ]  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
        uv_group: [ "ci-llvm-main", "ci-llvm-22", "ci-llvm-21" ]
        include:
          - bits: 32
            # A 64-bit compiler targeting x86, rather than the 32-bit one, so
            # that large translation units don't exhaust its address space.
            arch: amd64_x86
            python: cpython-3.10.20-windows-x86-none
          # - bits: 64  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
          #   arch: x64
          #   python: cpython-3.10.20-windows-x86_64-none

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}
          # Per-configuration key: jobs otherwise share one key and the first
          # to save wins, so source-built wheels (e.g. i686) are never reused.
          cache-suffix: ${{ matrix.python }}-${{ matrix.uv_group }}

      # vcpkg otherwise rebuilds every dependency (wabt, flatbuffers, ...) on
      # each run. Its ABI hashes make stale archives harmless cache misses.
      - name: Set up vcpkg binary cache directory
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vcpkg-archives"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Sync CI environment
        run: |
          # uv uses the host platform for dependency resolution regardless of the target
          # Python, so on Windows it would download x86_64 halide-llvm (~250MB) even for
          # a 32-bit build. Instead: read the pinned version from the lockfile (no download),
          # sync only ci-base (no LLVM), then fetch the correct win32 wheel directly.
          LLVM_VER=$(uv export --group '${{ matrix.uv_group }}' --no-emit-project \
            | awk -F'==' '/^halide-llvm==/ { gsub(/ .*/, "", $2); print $2 }')

          uv sync --frozen --python '${{ matrix.python }}' --group ci-base --no-install-workspace
          uv pip install --python-platform i686-pc-windows-msvc --only-binary :all: \
            --extra-index-url https://pypi.halide-lang.org/simple/ \
            "halide-llvm==${LLVM_VER}"

          echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ci-windows-x86-${{ matrix.bits }}

      - name: Save vcpkg binary cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Initial build
        if: github.event_name == 'pull_request'
        run: cmake --build build

      # See doc/Testing.md for the meaning of the labels used to skip redundant
      # tests.
      - name: Configure test filters
        if: github.event_name == 'pull_request'
        run: |
          exclude="performance"
          if [[ "${{ matrix.uv_group }}" != "ci-llvm-main" ]]; then
            exclude+="|fuzz|llvm_independent"
          fi
          echo "CTEST_EXCLUDE=${exclude}" >> "$GITHUB_ENV"

      - name: Test (host)
        if: github.event_name == 'pull_request'
        run: |
          cmake -S . -B build -DHalide_TARGET=host
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
          echo "CTEST_EXCLUDE=${CTEST_EXCLUDE}|target_independent" >> "$GITHUB_ENV"

      - name: Test (no extensions)
        if: github.event_name == 'pull_request'
        run: |
          cmake -S . -B build -DHalide_TARGET=cmake
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
