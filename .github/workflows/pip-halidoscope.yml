name: Build Halidoscope wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built wheels to PyPI (release branches only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/halidoscope/**'
      - '.github/workflows/pip-halidoscope.yml'
  release:
    types: [ published ]
  push:
    branches: [ main ]
    paths:
      - 'tools/halidoscope/**'
      - '.github/workflows/pip-halidoscope.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

# Halidoscope is a companion CLI/GUI packaged independently of Halide's own
# Python wheels (halide, halide-bin, halide-runtime): it doesn't depend on
# them, and this workflow doesn't participate in pip.yml's publish job. Its
# version is kept in sync with Halide's release version via tbump (see
# tool.tbump.file entries for tools/halidoscope/src-tauri/Cargo.toml et al.
# in the top-level pyproject.toml). The exception is nightly builds from
# main, which get a setuptools-scm dev version (e.g. 23.0.0.dev5) like the
# other Halide wheels and are published to https://pypi.halide-lang.org.
#
# Wheels are published to PyPI when a GitHub release is published, or when
# this workflow is run manually from a release branch with `publish` checked.
# Since the version only changes with Halide's version, a post-release of
# Halide reuses the existing Halidoscope version; such uploads are skipped
# rather than failing.
jobs:
  build:
    name: Build wheel for ${{ matrix.platform_tag }}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: manylinux_x86_64
          - os: windows-latest
            platform_tag: win_amd64
          - os: macos-15-intel
            platform_tag: macosx_x86_64
          - os: macos-15
            platform_tag: macosx_arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Set nightly version
        if: github.event_name == 'push' && github.ref_name == 'main'
        working-directory: tools/halidoscope
        shell: bash
        run: |
          version=$(uvx --from setuptools-scm python -c \
            "from setuptools_scm import get_version; print(get_version(root='../..', local_scheme='no-local-version'))")
          echo "Nightly version: ${version}"
          # A static project.version takes precedence over Cargo.toml's.
          sed -i.bak "s/^dynamic = \[\"version\"\]$/version = \"${version}\"/" pyproject.toml
          rm pyproject.toml.bak
          grep -qx "version = \"${version}\"" pyproject.toml

      - name: Install Tauri's Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: tools/halidoscope/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/halidoscope/pnpm-lock.yaml

      - name: Build frontend
        working-directory: tools/halidoscope
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build wheel
        working-directory: tools/halidoscope
        run: uvx maturin build --release --out wheelhouse

      - name: Smoke-test wheel
        working-directory: tools/halidoscope
        shell: bash
        run: |
          uv venv .smoke-test-venv
          uv pip install --python .smoke-test-venv --no-index --find-links wheelhouse halidoscope
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./.smoke-test-venv/Scripts/halidoscope --version
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            # tauri::Builder::run() initializes tao's GTK-backed event loop
            # before dispatching to any CLI subcommand, so even `--version`
            # needs a display on Linux.
            xvfb-run -a ./.smoke-test-venv/bin/halidoscope --version
          else
            ./.smoke-test-venv/bin/halidoscope --version
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-halidoscope-${{ matrix.platform_tag }}
          path: tools/halidoscope/wheelhouse/*.whl

  publish:
    name: Publish wheels
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main')
      || github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && inputs.publish
          && startsWith(github.ref, 'refs/heads/release/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.PYPI_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-halidoscope-*
          merge-multiple: true
          path: dist

      - name: Publish nightly build to halide/pypi
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(dist/halidoscope-*.whl)
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Halidoscope wheels in dist/"
            exit 1
          fi

          # Wheel filenames are "{name}-{version}-{tags}.whl".
          version=$(basename "${files[0]}")
          version="${version#halidoscope-}"
          version="${version%%-*}"
          tag="halidoscope@${version}"

          if gh release view "$tag" --repo halide/pypi >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo halide/pypi --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo halide/pypi --title "$tag" --notes "Automated nightly build from Halide"
          fi

      - name: Trigger index rebuild
        if: github.event_name == 'push'
        run: gh workflow run rebuild-index.yml --repo halide/pypi

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name != 'push'
        with:
          skip-existing: true
