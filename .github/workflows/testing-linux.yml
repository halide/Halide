name: Linux

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".lldbinit"
      - ".github/**"
      - "!.github/workflows/testing-linux.yml"
      - "packaging/**"
      - "Makefile"
      - "Makefile.inc"
      - 'run-clang-tidy.sh'
      - '**.clang-tidy'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: linux-${{ matrix.bits }} / ${{ matrix.uv_group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bits: [ "32" ]  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
        uv_group: [ "ci-llvm-main", "ci-llvm-22", "ci-llvm-21" ]
        include:
          - bits: 32
            arch: i686
            python: cpython-3.11.5-linux-x86-gnu  # latest available on uv
          # - bits: 64  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
          #   arch: x86_64
          #   python: cpython-3.10-linux-x86_64-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo dpkg --add-architecture i386
          fi

          apt_update() {
            for i in 1 2 3; do
              if sudo apt-get update; then return 0; fi
              echo "apt-get update failed (attempt $i/3), retrying in 10s..."
              sleep 10
            done
            return 1
          }
          apt_update

          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo apt-get install -y \
              gcc-multilib \
              g++-multilib \
              libpng-dev:i386 \
              libjpeg-dev:i386
          else
            sudo apt-get install -y \
              libpng-dev \
              libjpeg-dev
          fi

      - name: Sync CI environment
        run: |
          # halide-llvm comes from pypi.halide-lang.org, whose upstream network
          # path intermittently blackholes a source IP for tens of seconds to
          # a few minutes (root-caused in halide/build_bot#362, escalated to
          # MIT network ops). uv's own retries only span ~47s, which wasn't
          # always enough, so this retries harder (5 attempts, backoff
          # doubling 60s -> 300s) and logs the runner's egress IP plus a path
          # trace to the PyPI host on each failure, so a specific incident's
          # 5-tuple/timestamp can be handed to MIT for correlation.
          retry() {
            local i n=5 delay=60 max_delay=300
            for ((i = 1; i <= n; i++)); do
              if "$@"; then return 0; fi
              if [ "$i" -lt "$n" ]; then
                echo "::warning::CI env sync attempt $i/$n failed at $(date -u +%FT%TZ); retrying in ${delay}s"
                echo "::group::Network diagnostics (attempt $i/$n)"
                echo "egress IP: $(curl -s --max-time 5 https://api.ipify.org || echo unknown)"
                if command -v tracepath >/dev/null 2>&1; then
                  tracepath -m 15 pypi.halide-lang.org || true
                elif command -v traceroute >/dev/null 2>&1; then
                  traceroute -m 15 -w 2 pypi.halide-lang.org || true
                elif command -v tracert >/dev/null 2>&1; then
                  tracert -h 15 -w 2000 pypi.halide-lang.org || true
                else
                  echo "no traceroute tool available"
                fi
                echo "::endgroup::"
                sleep "$delay"
                delay=$((delay * 2 > max_delay ? max_delay : delay * 2))
              fi
            done
            return 1
          }

          retry setarch ${{ matrix.arch }} bash -ec "
            CC='gcc -m${{ matrix.bits }}' CXX='g++ -m${{ matrix.bits }}' \
            uv sync --python '${{ matrix.python }}' --group '${{ matrix.uv_group }}' --no-install-project
            echo '${GITHUB_WORKSPACE}/.venv/bin' >> '$GITHUB_PATH'
            echo 'VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv' >> '$GITHUB_ENV'
          "

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ci-linux-x86-${{ matrix.bits }}

      - name: Initial build
        run: cmake --build build

      - name: DEBUG - print cpu info and Halide host target
        run: |
          cat /proc/cpuinfo
          ./build/src/autoschedulers/common/get_host_target

      - name: Test (host)
        run: |
          cmake -S . -B build -DHalide_TARGET=host
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE performance -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5

      - name: Test (no extensions)
        run: |
          cmake -S . -B build -DHalide_TARGET=cmake
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE performance -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
