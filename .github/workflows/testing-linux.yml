name: Linux

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".lldbinit"
      - ".github/**"
      - "!.github/workflows/testing-linux.yml"
      - "packaging/**"
      - "Makefile"
      - "Makefile.inc"
      - 'run-clang-tidy.sh'
      - '**.clang-tidy'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: linux-${{ matrix.bits }} / ${{ matrix.uv_group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bits: [ "32" ]  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
        uv_group: [ "ci-llvm-main", "ci-llvm-22", "ci-llvm-21" ]
        include:
          - bits: 32
            arch: i686
            python: cpython-3.11.5-linux-x86-gnu  # latest available on uv
          # - bits: 64  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
          #   arch: x86_64
          #   python: cpython-3.10-linux-x86_64-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo dpkg --add-architecture i386
          fi

          apt_update() {
            for i in 1 2 3; do
              if sudo apt-get update; then return 0; fi
              echo "apt-get update failed (attempt $i/3), retrying in 10s..."
              sleep 10
            done
            return 1
          }
          apt_update

          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo apt-get install -y \
              gcc-multilib \
              g++-multilib \
              libpng-dev:i386 \
              libjpeg-dev:i386
          else
            sudo apt-get install -y \
              libpng-dev \
              libjpeg-dev
          fi

      - name: Sync CI environment
        run: |
          setarch ${{ matrix.arch }} bash -ec "
            CC='gcc -m${{ matrix.bits }}' CXX='g++ -m${{ matrix.bits }}' \
            uv sync --frozen --python '${{ matrix.python }}' --group '${{ matrix.uv_group }}' --no-install-workspace
            echo '${GITHUB_WORKSPACE}/.venv/bin' >> '$GITHUB_PATH'
            echo 'VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv' >> '$GITHUB_ENV'
          "

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ci-linux-x86-${{ matrix.bits }}

      - name: Initial build
        run: cmake --build build

      - name: DEBUG - print cpu info and Halide host target
        run: |
          cat /proc/cpuinfo
          ./build/src/autoschedulers/common/get_host_target

      - name: Test (host)
        run: |
          cmake -S . -B build -DHalide_TARGET=host
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE performance -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5

      - name: Test (no extensions)
        run: |
          cmake -S . -B build -DHalide_TARGET=cmake
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE performance -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5

  android-apps:
    # Deliberately its own job on Ubuntu (not folded into `macos`/HelloiOS's
    # job): unlike HelloiOS, cross-compiling for Android has no dependency on
    # Xcode or any other macOS-only tooling, so it doesn't need to spend
    # macOS CI minutes. GitHub's hosted ubuntu-24.04 image ships an Android
    # SDK+NDK by default, same as its macOS image does for Xcode/HelloiOS.
    # The app builds a real APK via its own Gradle/CMake `externalNativeBuild`
    # project -- Halide's generators are built as a side effect of that same
    # CMake configure (see app/src/main/cpp/CMakeLists.txt), so no separate
    # generator pre-build step is needed here.
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: HelloAndroid app
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libjpeg-dev

      - name: Sync CI environment
        run: |
          uv sync --frozen --group ci-llvm-main --no-install-workspace
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >-
          cmake --preset ci-linux-x86-64
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build and install Halide
        run: cmake --build build --target install

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Point Gradle at a CMake >= 3.28
        # AGP's own bundled/SDK-managed CMake package defaults to an older
        # version than Halide's CMake floor; point it at the system CMake
        # (already >= 3.28, since building Halide itself above requires it)
        # via the documented `cmake.dir` local.properties key instead.
        run: |
          cmake_dir="$(dirname "$(dirname "$(command -v cmake)")")"
          echo "cmake.dir=${cmake_dir}" | tee apps/HelloAndroid/local.properties

      - name: Build HelloAndroid
        working-directory: apps/HelloAndroid
        run: ./gradlew assembleDebug "-PHalide_ROOT=${{ github.workspace }}/install"

      - name: Enable KVM group perms (required by the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A build-only check can't catch bugs like a missing runtime permission
      # request or native buffer handling -- those only show up once the app
      # actually runs and tries to open the camera. x86_64 (not arm64-v8a) so
      # the emulator gets KVM hardware acceleration on these x86_64 runners.
      - name: Run smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          # android-emulator-runner's `script` input splits on newlines and
          # runs each line as its own independent `sh -c` command -- it does
          # NOT honor `\` line-continuation across lines -- so each invocation
          # below must stay on a single line.
          script: |
            apps/HelloAndroid/android_smoke_test.sh apps/HelloAndroid/app/build/outputs/apk/debug/app-debug.apk com.example.helloandroid .CameraActivity android.permission.CAMERA

  baremetal-apps:
    # Deliberately its own job: needs an arm-none-eabi cross toolchain and
    # QEMU's Arm system emulator, neither of which any other job installs.
    # Actually cross-compiles and runs all three documented build methods
    # (see apps/HelloBaremetal/README.md) under QEMU with semihosting, rather
    # than only checking that they build for host.
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: HelloBaremetal apps
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libjpeg-dev gcc-arm-none-eabi qemu-system-arm

      - name: Sync CI environment
        run: |
          uv sync --frozen --group ci-llvm-main --no-install-workspace
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >-
          cmake --preset ci-linux-x86-64
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build and install Halide
        run: cmake --build build --target install

      - name: Build HelloBaremetal (host target)
        working-directory: apps/HelloBaremetal
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/install
        run: |
          for method in cmake-twice cmake-super_build cmake-external_project; do
            cmake -S "$method" -B "$method/build"
            cmake --build "$method/build"
          done

      # The actual point of this job: build.sh cross-compiles each method for
      # the bare-metal Arm target, then ctest runs the result under QEMU with
      # semihosting, actually exercising the cross-compiled binary rather than
      # only checking that it builds for host.
      - name: Build and run HelloBaremetal (bare-metal cross-compile under QEMU)
        working-directory: apps/HelloBaremetal
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/install
        run: |
          declare -A test_dir=(
            [cmake-twice]=build-target
            [cmake-super_build]=build/app
            [cmake-external_project]=build
          )
          for method in cmake-twice cmake-super_build cmake-external_project; do
            ( cd "$method" && ./build.sh )
            ctest --test-dir "$method/${test_dir[$method]}" --output-on-failure
          done
