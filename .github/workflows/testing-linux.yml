name: Linux

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "doc/**"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".lldbinit"
      - ".github/**"
      - "!.github/workflows/testing-linux.yml"
      - "packaging/**"
      - "Makefile"
      - "Makefile.inc"
      - 'run-clang-tidy.sh'
      - '**.clang-tidy'
      - "**.md"
      - ".claude/**"
      - ".devcontainer/**"
      - ".pre-commit-config.yaml"
      - ".clang-format"
      - ".clang-format-ignore"
      - "run-clang-format.sh"
      - ".git-blame-ignore-revs"
      - ".gdbinit"
      - "tools/audit_test_labels.py"
      - "tools/check_cmake_*.py"
      # Apps are tested by testing-apps.yml; test/integration by testing-ecosystem.yml.
      - "apps/**"
      - "test/integration/**"
      - "codecov.yml"
      - "tools/run-coverage.sh"
      # Python bindings are disabled in this workflow's CI presets.
      - "python_bindings/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: linux-${{ matrix.bits }} / ${{ matrix.uv_group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bits: [ "32" ]  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
        uv_group: [ "ci-llvm-main", "ci-llvm-22", "ci-llvm-21" ]
        include:
          - bits: 32
            arch: i686
            python: cpython-3.11.5-linux-x86-gnu  # latest available on uv
          # - bits: 64  # Intentionally not 64, as we haven't configured self-hosted runners for it yet.
          #   arch: x86_64
          #   python: cpython-3.10-linux-x86_64-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Per-configuration key: jobs otherwise share one key and the first
          # to save wins, so source-built wheels (e.g. i686) are never reused.
          cache-suffix: ${{ matrix.python }}-${{ matrix.uv_group }}

      # vcpkg otherwise rebuilds every dependency (wabt, flatbuffers, ...) on
      # each run. Its ABI hashes make stale archives harmless cache misses.
      - name: Set up vcpkg binary cache directory
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vcpkg-archives"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-

      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo dpkg --add-architecture i386
          fi

          apt_update() {
            for i in 1 2 3; do
              if sudo apt-get update; then return 0; fi
              echo "apt-get update failed (attempt $i/3), retrying in 10s..."
              sleep 10
            done
            return 1
          }
          apt_update

          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo apt-get install -y \
              gcc-multilib \
              g++-multilib \
              libpng-dev:i386 \
              libjpeg-dev:i386
          else
            sudo apt-get install -y \
              libpng-dev \
              libjpeg-dev
          fi

      - name: Sync CI environment
        run: |
          setarch ${{ matrix.arch }} bash -ec "
            CC='gcc -m${{ matrix.bits }}' CXX='g++ -m${{ matrix.bits }}' \
            uv sync --frozen --python '${{ matrix.python }}' --group '${{ matrix.uv_group }}' --no-install-workspace
            echo '${GITHUB_WORKSPACE}/.venv/bin' >> '$GITHUB_PATH'
            echo 'VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv' >> '$GITHUB_ENV'
          "

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ci-linux-x86-${{ matrix.bits }}

      - name: Initial build
        run: cmake --build build

      - name: DEBUG - print cpu info and Halide host target
        run: |
          cat /proc/cpuinfo
          ./build/src/autoschedulers/common/get_host_target

      # See doc/Testing.md for the meaning of the labels used to skip redundant
      # tests.
      - name: Configure test filters
        run: |
          exclude="performance"
          if [[ "${{ matrix.uv_group }}" != "ci-llvm-main" ]]; then
            exclude+="|fuzz|llvm_independent"
          fi
          echo "CTEST_EXCLUDE=${exclude}" >> "$GITHUB_ENV"

      - name: Test (host)
        run: |
          cmake -S . -B build -DHalide_TARGET=host
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
          echo "CTEST_EXCLUDE=${CTEST_EXCLUDE}|target_independent" >> "$GITHUB_ENV"

      - name: Test (no extensions)
        run: |
          cmake -S . -B build -DHalide_TARGET=cmake
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5

  # HelloAndroid and HelloBaremetal run in testing-apps.yml.
