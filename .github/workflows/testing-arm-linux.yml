name: ARM Linux

on:
  # Pull requests can restore caches saved on main but not each other's, so
  # caches are only saved by these runs, which stop once the caches are
  # filled. See the "Save vcpkg binary cache" step.
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/testing-arm-linux.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/vcpkg-ports/**"
      - "cmake/vcpkg-triplets/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "doc/**"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - ".gitignore"
      - ".gitattributes"
      - ".gitmodules"
      - ".lldbinit"
      - ".github/**"
      - "!.github/workflows/testing-arm-linux.yml"
      - "packaging/**"
      - "Makefile"
      - "Makefile.inc"
      - 'run-clang-tidy.sh'
      - '**.clang-tidy'
      - "**.md"
      - ".claude/**"
      - ".devcontainer/**"
      - ".pre-commit-config.yaml"
      - ".clang-format"
      - ".clang-format-ignore"
      - "run-clang-format.sh"
      - ".git-blame-ignore-revs"
      - ".gdbinit"
      - "tools/audit_test_labels.py"
      - "tools/check_cmake_*.py"
      # Apps are tested by testing-apps.yml; test/integration by testing-ecosystem.yml.
      - "apps/**"
      - "test/integration/**"
      - "codecov.yml"
      - "tools/run-coverage.sh"
      # Python bindings are disabled in this workflow's CI presets.
      - "python_bindings/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm-linux:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip_buildbots')"
    name: arm-${{ matrix.bits }} / ${{ matrix.uv_group }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        bits: [ "64", "32" ]
        uv_group: [ "ci-llvm-main", "ci-llvm-22", "ci-llvm-21" ]
        include:
          - bits: 32
            arch: armv7l
            python: 3.11-armv7-gnueabihf  # needed for piwheels
          - bits: 64
            arch: aarch64
            python: linux-aarch64-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}
          # Per-configuration key: jobs otherwise share one key and the first
          # to save wins, so source-built wheels (e.g. i686) are never reused.
          cache-suffix: ${{ matrix.python }}-${{ matrix.uv_group }}

      # vcpkg otherwise rebuilds every dependency (wabt, flatbuffers, ...) on
      # each run. Its ABI hashes make stale archives harmless cache misses.
      - name: Set up vcpkg binary cache directory
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vcpkg-archives"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: vcpkg-${{ github.job }}-${{ matrix.bits }}${{ matrix.arch }}-

      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo dpkg --add-architecture armhf
          fi

          apt_update() {
            for i in 1 2 3; do
              if sudo apt-get update; then return 0; fi
              echo "apt-get update failed (attempt $i/3), retrying in 10s..."
              sleep 10
            done
            return 1
          }
          apt_update

          if [[ "${{ matrix.bits }}" == "32" ]]; then
            sudo apt-get install -y \
              binutils-arm-linux-gnueabihf \
              g++-arm-linux-gnueabihf \
              gcc-arm-linux-gnueabihf \
              libc6:armhf \
              libstdc++6:armhf \
              libatomic1:armhf \
              libpng-dev:armhf \
              libjpeg-dev:armhf
          else
            sudo apt-get install -y \
              libpng-dev \
              libjpeg-dev
          fi

      - name: Sync CI environment
        run: |
          setarch ${{ matrix.arch }} bash -ec "
            uv sync --frozen --python '${{ matrix.python }}' --group '${{ matrix.uv_group }}' --no-install-workspace
            echo '${GITHUB_WORKSPACE}/.venv/bin' >> '$GITHUB_PATH'
            echo 'VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv' >> '$GITHUB_ENV'
          "

      - name: Configure LLVM
        run: echo "Halide_LLVM_ROOT=$(halide-llvm --prefix)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ci-linux-arm-${{ matrix.bits }}

      - name: Save vcpkg binary cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Initial build
        if: github.event_name == 'pull_request'
        run: cmake --build build

      - name: Detect host target
        if: github.event_name == 'pull_request'
        run: |
          HOST_TARGET=$(./build/src/autoschedulers/common/get_host_target)
          echo "HAS_SVE2=$([[ "$HOST_TARGET" == *sve2* ]] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "Detected host target: ${HOST_TARGET}"

      # See doc/Testing.md for the meaning of the labels used to skip redundant
      # tests. The first target step varies (host is skipped without SVE2).
      - name: Configure test filters
        if: github.event_name == 'pull_request'
        run: |
          exclude="performance"
          include="."
          if [[ "${{ matrix.uv_group }}" != "ci-llvm-main" ]]; then
            exclude+="|fuzz"
            include="calls_llvm|generator|tutorial|autoschedulers"
          fi
          {
            echo "CTEST_EXCLUDE=${exclude}"
            echo "CTEST_INCLUDE=${include}"
            echo "CTEST_TARGET_INCLUDE=."
          } >> "$GITHUB_ENV"

      - name: Test (host)
        if: github.event_name == 'pull_request' && (matrix.bits == '32' || env.HAS_SVE2 == 'true')
        run: |
          cmake -S . -B build -DHalide_TARGET=host
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L "${CTEST_INCLUDE}" -L "${CTEST_TARGET_INCLUDE}" -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
          echo "CTEST_TARGET_INCLUDE=target_from_environment|generator|tutorial|autoschedulers" >> "$GITHUB_ENV"

      - name: Test (NEON)
        if: github.event_name == 'pull_request' && (matrix.bits == '64')
        run: |
          cmake -S . -B build -DHalide_TARGET=arm-64-linux-arm_dot_prod-arm_fp16
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L "${CTEST_INCLUDE}" -L "${CTEST_TARGET_INCLUDE}" -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
          echo "CTEST_TARGET_INCLUDE=target_from_environment|generator|tutorial|autoschedulers" >> "$GITHUB_ENV"

      - name: Test (no extensions)
        if: github.event_name == 'pull_request'
        run: |
          cmake -S . -B build -DHalide_TARGET=cmake
          cmake --build build
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L "${CTEST_INCLUDE}" -L "${CTEST_TARGET_INCLUDE}" -LE "${CTEST_EXCLUDE}" -j "$(nproc)"
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure -L performance --repeat until-pass:5
