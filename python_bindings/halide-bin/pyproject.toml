[build-system]
requires = ["scikit-build-core~=1.0.3", "setuptools-scm>=8.3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "halide-bin"
authors = [
  { name = "The Halide team", email = "halide-dev@lists.csail.mit.edu" },
]
maintainers = [{ name = "Alex Reinking", email = "areinking@adobe.com" }]
description = "Python-independent binary components for Halide (libHalide, autoschedulers, generator tools, headers, CMake package files)."
license = "MIT"
requires-python = ">=3.10"
dynamic = ['version']
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://halide-lang.org"
Documentation = "https://halide-lang.org/docs"
Issues = "https://github.com/halide/Halide/issues"
Repository = "https://github.com/halide/Halide.git"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
ninja.version = ">=1.11,!=1.13.0"
cmake.source-dir = "../.."
wheel.install-dir = "halide"
# No Python extension modules in this package -- python-version-agnostic tag.
wheel.py-api = "py3"
sdist.inclusion-mode = "explicit"
sdist.include = [
  "pyproject.toml",
  "src/halide/bin/__init__.py",
  "python_bindings/halide-bin/src/halide/bin/__init__.py",
]

[tool.scikit-build.sdist.force-include]
"../../cmake" = "cmake"
"../../dependencies" = "dependencies"
"../../packaging" = "packaging"
"../../python_bindings" = "python_bindings"
"../../src" = "src"
"../../tools" = "tools"
"../../.git_archival.txt" = ".git_archival.txt"
"../../CMakeLists.txt" = "CMakeLists.txt"
"../../LICENSE.txt" = "LICENSE.txt"
"../../README.md" = "README.md"
"../../vcpkg.json" = "vcpkg.json"
"../../vcpkg-configuration.json" = "vcpkg-configuration.json"

[tool.scikit-build.wheel.force-include]
"python_bindings/halide-bin/src/halide/bin/__init__.py" = "halide/bin/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_DISABLE_FIND_PACKAGE_JPEG = true
CMAKE_DISABLE_FIND_PACKAGE_PNG = true
FETCHCONTENT_FULLY_DISCONNECTED = true
Halide_ENABLE_EXCEPTIONS = true
Halide_ENABLE_RTTI = true
Halide_WASM_BACKEND = "wabt"
WITH_PYTHON_BINDINGS = false
WITH_TESTS = false
WITH_TUTORIALS = false
WITH_UTILS = false

##
# Don't version libHalide.so/dylib -- wheels are zip files that do
# not understand symbolic links. Including version information here
# causes the final wheel to have three copies of our library. Not good.
CMAKE_PLATFORM_NO_VERSIONED_SONAME = true

[[tool.scikit-build.overrides]]
if.platform-system = "^win32"
inherit.cmake.define = "append"
cmake.define.Halide_WASM_BACKEND = "OFF"

[[tool.scikit-build.overrides]]
if.from-sdist = true
cmake.source-dir = "."

[tool.setuptools_scm]
root = "../.."
