[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halide-gepa-scheduling"
version = "0.1.0"
description = "GEPA evaluation harness for Halide's scheduling skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gepa==0.1.4", "pyyaml>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
halide-gepa-scheduling = "gepa_scheduling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gepa_scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]
